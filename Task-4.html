<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IRCTC</title>
        <style>
            header{
                text-align: left;
                color: white;
                font-family:monospace;
            }
            body{
                background-color: rgb(29, 32, 106);
            }
            section{
                background-color: rgb(250, 250, 253);
                text-align: left;
                color: rgb(7, 0, 0);
                font-family:'Arial , sans-serif';
                font-size: 15px;
                border-radius: 10px;
                padding-left: 20px;
                height: 600px;
                padding:20px;
            }
            button{
                background-color: rgb(216, 113, 34);
                color: white;
                font-family: monospace;
                font-size: 15px;
                border-radius: 10px;
                width: 300px;
            }
        </style> 
    </head>
    <body>
        <header>
            <h1>IRCTC </h1>
        </header>
        <section>
            <input type="text" placeholder="From" ><br><br>
            <input type="text" placeholder="To" ><br><br>
            <input type="date" placeholder="Date" ><br><br>
            <select type="text" placeholder="Class" ><br><br>
                <option value="All Classes">All Classes</option>
                <option value="Sleeper">Sleeper</option>
                <option value="AC1">AC1</option>
                <option value="AC2">AC2</option>
                <option value="AC3">AC3</option>
                <option value="CC">CC</option>
            </select><br><br>
            <select type="text" placeholder="Quota" ><br><br>
                <option value="General">General</option>
                <option value="Ladies">Ladies</option>
                <option value="SeniorCitizen">Senior Citizen</option>
            </select><br><br>
            <input type="checkbox" id="disability">
            <label for="disability">Person With Disability Concession</label><br><br>
            <input type="checkbox" id="flexible">
            <label for="flexible">Flexible with date</label><br><br>
            <input type="checkbox" id="Pass">
            <label for="checkbox">Railway Pass Concession</label><br><br>
            <button>Search Trains</button><br><br>
            <button style="width: 150px; background-color: rgb(29, 32, 106);">PNR Status</button>
            <button style="width: 150px; background-color: rgb(29, 32, 106);">Charts/Vacancy</button>
        </section>
    </body>
</html>
