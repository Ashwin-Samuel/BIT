<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Internal/External/InLine CSS</title>
        <style>
            h1{
                color: rgb(4, 86, 52);
                text-align: center;
            }
            p{
                color: rgb(195, 16, 16);
                font-size: 20px;
                text-align: center;
            }
        </style>
        <link rel="stylesheet" href="Lab5.css">
    </head>
    <body>
        <h1>Internal CSS</h1>
        <p>This is a paragraph uses Internal CSS.</p>
        <h1 style="color: rgb(0, 0, 255); text-align: center; font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif">Inline CSS</h1>
        <p style="color: rgb(255, 0, 187); font-size: 20px; text-align: center; font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif">This is a paragraph uses Inline CSS.</p>
        <h2>External CSS</h2>
        <h3>This is a paragraph uses External CSS.</h3>
    </body>
</html>
